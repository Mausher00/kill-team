<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>Kill Team — Constructor de Comando</title>
<link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="imagenes/app/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="imagenes/app/icono-192.png">
  <link rel="stylesheet" href="css/iconos.css">
<link rel="stylesheet" href="css/fonts.css">
<style>
/* ── TOKENS (heredados de la app principal) ───────────────── */
:root {
  --bg:          #0a0a0a;
  --bg-2:        #111111;
  --bg-3:        #1a1a1a;
  --bg-4:        #222222;
  --border:      #2a2a2a;
  --border-2:    #333333;
  --text:        #e8e8e8;
  --text-2:      #999999;
  --text-3:      #555555;
  --orange:      #E8490F;
  --orange-dim:  #7a2508;
  --orange-bg:   #1a0a04;
  --orange-light:#f07040;
  --green:       #2a6e3a;
  --green-bg:    #0a1a0e;
  --green-light: #4caf70;
  --action-bg:   #1a1200;
  --action:      #d4a010;
  --r-sm: 2px; --r-md: 4px; --r-lg: 6px;
  --font-display:'D-DINCondensed', 'Arial Narrow', sans-serif;
  --font-mono:   'D-DINExp', 'Courier New', monospace;
  --font-body:   'D-DIN', Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; padding-bottom: 100px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 12px; }
button { cursor: pointer; font-family: var(--font-body); }

/* ── HEADER ─────────────────────────────────────────────── */
.hdr { border-bottom: 3px solid var(--orange); padding: 1.2rem 0 .8rem; margin-bottom: 1.4rem; }
.hdr-pre { font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--orange); display: block; margin-bottom: 2px; }
.hdr-title { font-family: var(--font-display); font-size: 36px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #fff; line-height: 1; }
.hdr-nav { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.btn-back { background: none; border: none; color: var(--text-3); font-size: 12px; font-family: var(--font-display); letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; padding: 0; transition: color .15s; }
.btn-back:hover { color: var(--text-2); }

/* ── PASOS (stepper) ────────────────────────────────────── */
.stepper { display: flex; gap: 0; margin-bottom: 1.4rem; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--border-2); }
.step { flex: 1; padding: 8px 6px; text-align: center; font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); background: var(--bg-2); border-right: 1px solid var(--border-2); transition: background .2s, color .2s; }
.step:last-child { border-right: none; }
.step.active { background: var(--orange); color: #fff; }
.step.done { background: var(--bg-3); color: var(--green-light); }
.step-num { display: block; font-size: 14px; line-height: 1; }

/* ── SECTION LABEL ──────────────────────────────────────── */
.sec-lbl { font-size: 11px; font-weight: 700; font-family: var(--font-display); color: var(--text-2); text-transform: uppercase; letter-spacing: .14em; margin: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
.sec-lbl::after { content: ''; flex: 1; height: 1px; background: var(--orange); opacity: .4; }

/* ── PASO 1: selección de facción ───────────────────────── */
.faction-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.faction-card { background: var(--bg-2); border: 1px solid var(--border-2); border-top: 3px solid var(--orange); border-radius: var(--r-lg); overflow: hidden; cursor: pointer; transition: border-color .15s, transform .12s; }
.faction-card:hover { border-color: var(--orange); transform: translateY(-2px); }
.faction-card-img { width: 100%; height: 100px; object-fit: contain; background: var(--bg-3); padding: 10px; display: block; }
.faction-card-ph { width: 100%; height: 100px; background: var(--bg-3); display: flex; align-items: center; justify-content: center; font-size: 38px; }
.faction-card-body { padding: 8px 10px 10px; }
.faction-card-sub { font-family: var(--font-mono); font-size: 9px; color: var(--orange); letter-spacing: .1em; text-transform: uppercase; }
.faction-card-name { font-family: var(--font-display); font-size: 17px; font-weight: 800; text-transform: uppercase; color: #fff; line-height: 1.1; }
.faction-card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.ftag { font-size: 9px; padding: 1px 5px; border-radius: 2px; background: var(--bg-3); color: var(--text-3); border: .5px solid var(--border-2); font-family: var(--font-mono); text-transform: uppercase; }

/* ── PASO 2: selección de operativos ────────────────────── */
.counter-bar { display: flex; align-items: center; gap: 8px; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--r-md); padding: 8px 12px; margin-bottom: 12px; }
.counter-bar-label { font-family: var(--font-display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); flex: 1; }
.counter-val { font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--orange); }
.counter-max { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); }
.counter-bar.full .counter-val { color: var(--green-light); }

/* Tarjeta de operativo en el builder */
.op-entry { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--r-lg); margin-bottom: 5px; overflow: hidden; transition: border-color .15s; }
.op-entry.required-op { border-left: 3px solid var(--orange-dim); }
.op-entry.selected { border-color: var(--orange); border-left: 3px solid var(--orange); }
.op-entry.disabled { opacity: .35; pointer-events: none; }

.op-row { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 10px 12px; cursor: pointer; gap: 8px; }
.op-row:hover { background: var(--bg-3); }
.op-meta { min-width: 0; }
.op-type-badge { font-family: var(--font-mono); font-size: 9px; color: var(--orange); letter-spacing: .1em; text-transform: uppercase; }
.op-name { font-family: var(--font-display); font-size: 16px; font-weight: 800; text-transform: uppercase; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op-name small { font-size: 11px; color: var(--text-3); font-weight: 400; font-family: var(--font-body); text-transform: none; letter-spacing: 0; }
.op-stats { display: flex; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
.op-stat { font-size: 10px; color: var(--text-3); font-family: var(--font-mono); }
.op-stat span { color: var(--text-2); }
.op-note { font-size: 10px; color: var(--action); font-family: var(--font-mono); margin-top: 2px; }

.op-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.qty-box { display: flex; align-items: center; gap: 4px; }
.qty-btn { width: 26px; height: 26px; border-radius: var(--r-sm); border: 1px solid var(--border-2); background: var(--bg-3); color: var(--text); font-size: 14px; display: flex; align-items: center; justify-content: center; transition: background .12s, border-color .12s; }
.qty-btn:hover:not(:disabled) { background: var(--bg-4); border-color: var(--orange-dim); }
.qty-btn:disabled { opacity: .25; cursor: default; }
.qty-num { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--text); min-width: 20px; text-align: center; }
.qty-num.on { color: var(--orange); }
.badge-req { font-size: 9px; background: var(--orange-bg); color: var(--orange); border: .5px solid var(--orange-dim); padding: 2px 6px; border-radius: 2px; font-family: var(--font-mono); letter-spacing: .05em; text-transform: uppercase; }
.badge-half { font-size: 9px; background: var(--action-bg); color: var(--action); border: .5px solid #5a4000; padding: 2px 6px; border-radius: 2px; font-family: var(--font-mono); }

/* Loadout selector */
.loadout-panel { border-top: 1px solid var(--border); padding: 10px 12px; background: var(--bg-3); display: none; }
.loadout-panel.open { display: block; }
.loadout-title { font-size: 10px; font-family: var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
.loadout-opts { display: flex; flex-direction: column; gap: 5px; }
.loadout-opt { border: 1px solid var(--border-2); border-radius: var(--r-md); padding: 8px 10px; cursor: pointer; transition: border-color .12s, background .12s; }
.loadout-opt:hover { border-color: var(--orange-dim); background: var(--bg-4); }
.loadout-opt.chosen { border-color: var(--orange); background: var(--orange-bg); }
.loadout-label { font-family: var(--font-display); font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--text); letter-spacing: .04em; }
.loadout-weapons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.wpill { font-size: 10px; padding: 1px 6px; border-radius: 2px; background: var(--bg-2); color: var(--text-2); border: .5px solid var(--border-2); font-family: var(--font-mono); }
.wpill-rules { color: var(--text-3); font-style: italic; }

/* ── PASO 3: equipo ──────────────────────────────────────── */
.eq-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--r-md); padding: 8px 12px; margin-bottom: 12px; }
.eq-bar-label { font-family: var(--font-display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.eq-slots { font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--orange); }
.eq-slots.full { color: var(--green-light); }

.eq-card { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--r-md); padding: 10px 13px; margin-bottom: 5px; border-left: 3px solid var(--border-2); cursor: pointer; transition: border-color .12s; display: flex; align-items: flex-start; gap: 10px; }
.eq-card.selected { border-left-color: var(--orange); border-color: var(--orange); }
.eq-card:hover:not(.disabled-card) { border-color: var(--orange-dim); }
.eq-card.disabled-card { opacity: .35; cursor: default; }
.eq-check { width: 20px; height: 20px; border: 1.5px solid var(--border-2); border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; background: var(--bg-3); transition: background .12s, border-color .12s; }
.eq-card.selected .eq-check { background: var(--orange); border-color: var(--orange); }
.eq-card.selected .eq-check i { color: #fff; }
.eq-check i { color: transparent; font-size: 13px; }
.eq-info { flex: 1; min-width: 0; }
.eq-name { font-weight: 700; font-size: 13px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
.eq-qty { font-size: 9px; font-family: var(--font-mono); color: var(--text-3); margin-left: 6px; }
.eq-txt { font-size: 11px; color: var(--text-2); line-height: 1.5; margin-top: 3px; }
.eq-faction-badge { font-size: 9px; background: var(--orange-bg); color: var(--orange); border: .5px solid var(--orange-dim); padding: 1px 5px; border-radius: 2px; font-family: var(--font-mono); display: inline-block; margin-bottom: 3px; }

/* ── RESUMEN FINAL ──────────────────────────────────────── */
.summary-card { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--r-lg); border-top: 3px solid var(--orange); padding: 14px; margin-bottom: 10px; }
.summary-title { font-family: var(--font-display); font-size: 20px; font-weight: 800; text-transform: uppercase; color: #fff; margin-bottom: 12px; letter-spacing: .04em; }
.summary-op { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: .5px solid var(--border); }
.summary-op:last-child { border-bottom: none; }
.summary-op-type { font-family: var(--font-mono); font-size: 9px; color: var(--orange); min-width: 80px; letter-spacing: .05em; text-transform: uppercase; }
.summary-op-name { font-family: var(--font-display); font-size: 14px; font-weight: 800; text-transform: uppercase; color: var(--text); flex: 1; }
.summary-op-loadout { font-size: 11px; color: var(--text-3); }
.summary-eq { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.summary-eq-pill { font-size: 11px; padding: 3px 8px; border-radius: var(--r-sm); background: var(--bg-3); color: var(--text-2); border: .5px solid var(--border-2); font-family: var(--font-mono); }

/* ── BOTONES DE ACCIÓN ──────────────────────────────────── */
.action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0d0d0d; border-top: 2px solid var(--orange); padding: 10px 16px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; z-index: 100; max-width: 720px; margin: 0 auto; }
@media(min-width:720px) { .action-bar { left: 50%; right: auto; transform: translateX(-50%); width: 720px; border-radius: 6px 6px 0 0; } }
.action-info { flex: 1; font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
.btn { padding: 8px 18px; border-radius: var(--r-md); font-family: var(--font-display); font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; border: none; transition: opacity .15s; }
.btn:disabled { opacity: .3; cursor: default; }
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover:not(:disabled) { opacity: .88; }
.btn-ghost { background: var(--bg-3); color: var(--text-2); border: 1px solid var(--border-2); }
.btn-ghost:hover:not(:disabled) { border-color: var(--orange-dim); color: var(--text); }
.btn-print { background: var(--green); color: #fff; }
.btn-print:hover { opacity: .88; }

/* ── MISC ───────────────────────────────────────────────── */
.note-box { background: var(--action-bg); border: .5px solid #5a4000; border-radius: var(--r-md); padding: 8px 12px; font-size: 11px; color: var(--action); margin-bottom: 10px; line-height: 1.5; }
.error-pill { background: #2a0505; color: #f07070; border: .5px solid #5a1010; border-radius: var(--r-md); padding: 6px 12px; font-size: 11px; font-family: var(--font-mono); margin-bottom: 8px; display: none; }
.error-pill.show { display: block; }

/* ══════════════════════════════════════════════════════════
   MEJORAS v2 — mismos tokens y tipografía
   ══════════════════════════════════════════════════════════ */
.hdr { padding-top: 1.2rem; }
.hdr-nav { gap: 14px; flex-wrap: wrap; }
.btn-back { text-decoration: none; cursor: pointer; }
.btn-back:hover { color: var(--orange); }

/* Stepper clicable */
.step { cursor: default; position: relative; }
.step.reach { cursor: pointer; }
.step.reach:hover:not(.active) { color: var(--text); background: var(--bg-3); }
.step.done .step-num::after { content: ' ✓'; font-size: 11px; }
.stepper { position: sticky; top: 0; z-index: 40; box-shadow: 0 8px 20px -14px #000; }

/* Panel de estado (contador + progreso + checklist) */
.status { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--r-md); padding: 10px 12px 12px; margin-bottom: 12px; }
.status .counter-bar { background: none; border: none; padding: 0 0 8px; margin: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-family: var(--font-mono); padding: 3px 8px; border-radius: 2px; border: .5px solid var(--border-2); color: var(--text-3); background: var(--bg-3); transition: color .2s, border-color .2s, background .2s; }
.chk i { font-size: 12px; }
.chk.ok { color: var(--green-light); border-color: var(--green); background: var(--green-bg); }
.chk.bad { color: #f07070; border-color: #5a1010; background: #1a0505; }

/* Entradas */
.op-entry { transition: border-color .2s, box-shadow .25s, opacity .2s; }
.op-entry.selected { box-shadow: 0 8px 24px -16px rgba(232,73,15,.6); }
.op-entry.maxed .qty-btn:last-child { opacity: .25; }
.op-row:focus-visible { outline-offset: -2px; }
.op-entry .chv { color: var(--text-3); transition: transform .3s var(--ease-out); font-size: 14px; }
.op-entry.open .chv { transform: rotate(180deg); color: var(--orange); }
.loadout-panel { display: block; padding: 0; border-top: none; background: var(--bg-3); }
.loadout-panel .lp-in { padding: 10px 12px; border-top: 1px solid var(--border); }
.qty-btn { cursor: pointer; }
.qty-btn:active:not(:disabled) { transform: scale(.9); }
.op-entry.unavail { opacity: .45; }
.op-entry.unavail .op-row { cursor: default; }

/* Chips de ardid */
.ploy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
@media (max-width: 480px) { .ploy-grid { grid-template-columns: 1fr; } }
.ploy { text-align: left; border: 1px solid var(--border-2); background: var(--bg-2); border-radius: var(--r-md); padding: 7px 9px; color: var(--text-2); cursor: pointer; transition: border-color .15s, background .15s, color .15s; }
.ploy:hover:not(:disabled) { border-color: var(--action); color: var(--text); }
.ploy.on { border-color: var(--action); background: var(--action-bg); color: var(--action); }
.ploy:disabled { opacity: .35; cursor: default; }
.ploy b { display: block; font-family: var(--font-display); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.ploy small { font-family: var(--font-mono); font-size: 9px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }

/* Mis comandos */
.saved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-bottom: 1.4rem; }
.saved { background: var(--bg-2); border: 1px solid var(--border-2); border-left: 3px solid var(--orange); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.saved-name { font-family: var(--font-display); font-weight: 800; font-size: 16px; text-transform: uppercase; color: #fff; letter-spacing: .03em; line-height: 1.1; }
.saved-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
.saved-meta b { color: var(--orange); font-weight: 400; }
.saved-acts { display: flex; gap: 4px; margin-top: 6px; }
.saved-acts .icon-btn { height: 26px; min-width: 26px; padding: 0 7px; }
.saved-acts .icon-btn i { font-size: 13px; }
.empty-saved { border: 1px dashed var(--border-2); border-radius: var(--r-md); padding: 16px; color: var(--text-3); font-size: 12px; text-align: center; margin-bottom: 1.4rem; }
.tools-row { display: flex; gap: 8px; flex-wrap: wrap; margin: -4px 0 14px; }

.faction-card.no-roster { cursor: default; opacity: .4; filter: grayscale(.6); }
.faction-card.no-roster:hover { transform: none; border-color: var(--border-2); box-shadow: none; }
.faction-card .nr { font-family: var(--font-mono); font-size: 9px; color: var(--text-3); margin-top: 4px; text-transform: uppercase; letter-spacing: .06em; }

/* Resumen */
.name-in { width: 100%; background: transparent; border: none; border-bottom: 1px dashed var(--border-2); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .04em; padding: 2px 0 4px; margin-bottom: 4px; transition: border-color .15s; }
.name-in:focus { outline: none; border-bottom-color: var(--orange); }
.sum-sub { font-family: var(--font-mono); font-size: 10px; color: var(--orange); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }
.sum-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.sum-tbl th { font-family: var(--font-display); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); text-align: center; padding: 4px 6px; border-bottom: 2px solid var(--orange); }
.sum-tbl th:first-child { text-align: left; }
.sum-tbl td { padding: 6px; border-bottom: .5px solid var(--border); text-align: center; font-family: var(--font-mono); }
.sum-tbl td:first-child { text-align: left; font-family: var(--font-body); }
.sum-tbl td .t { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--orange); letter-spacing: .06em; text-transform: uppercase; }
.sum-tbl td .n { font-family: var(--font-display); font-weight: 800; font-size: 14px; text-transform: uppercase; color: var(--text); }
.sum-tbl td .x { color: var(--orange); font-family: var(--font-display); font-weight: 800; }
.sum-tbl tr:hover td { background: var(--bg-3); }
.sum-acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.zero-pill { border-color: #5a4000 !important; color: var(--action) !important; background: var(--action-bg) !important; }

.action-bar .btn { display: inline-flex; align-items: center; gap: 6px; transition: opacity .15s, transform .1s, background .15s; }
.action-bar .btn:active:not(:disabled) { transform: scale(.97); }
.action-info { display: flex; flex-direction: column; gap: 4px; }
.action-info .pbar { width: min(220px, 100%); }
.error-pill { position: sticky; bottom: 70px; }

@media print {
  .hdr-nav, .stepper, .sum-acts, .tools-row { display: none !important; }
  body { background: #fff; color: #000; padding: 0; }
  .summary-card { border-color: #000; }
}
</style>

<script>
// ============================================================
//  CONSTRUCTOR DE COMANDOS
//  El estado solo guarda datos serializables (claves, cantidades,
//  índices). Operativos y entradas se resuelven siempre desde
//  FACTIONS, así un comando guardado sobrevive a cambios de datos.
// ============================================================

const DRAFT_KEY  = 'builder.draft';
const SAVED_KEY  = 'rosters';
const MOD        = /Mac|iPhone|iPad/.test(navigator.platform || '') ? '⌘' : 'Ctrl';

const newState = () => ({
  step: 1, factionId: null, name: '', editingId: null,
  roster: {},      // { [key]: { qty, loadoutIdx, ploys: [] } }
  equipment: [],   // ids
  open: {},        // paneles abiertos (UI)
});
let state = newState();

// ── Utilidades de datos ──────────────────────────────────────
const slug = s => KT.norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const F = () => FACTIONS[state.factionId];

function entriesOf(f) {
  const out = [];
  (f.roster.required || []).forEach((entry, i) => out.push({
    key: 'req_' + i, entry, required: true, op: f.ops.find(o => o.type === entry.type) || null,
  }));
  (f.roster.pool?.entries || []).forEach(entry => out.push({
    key: 'pool_' + (entry.key || entry.type), entry, required: false,
    op: entry.type === 'ARDID_0PM' ? null : (f.ops.find(o => o.type === entry.type) || null),
  }));
  return out;
}

function item(key, e) {
  if (!state.roster[key]) state.roster[key] = {
    qty: e && e.required ? e.entry.count : 0,
    loadoutIdx: e && e.entry.loadouts?.length ? -1 : null,
    ploys: [],
  };
  return state.roster[key];
}

const cost = entry => entry.cost != null ? entry.cost : entry.half ? 0.5 : 1;

function slots(f = F()) {
  const list = entriesOf(f);
  let poolUsed = 0, reqTotal = 0;
  list.forEach(e => {
    const it = item(e.key, e);
    if (e.required) reqTotal += e.entry.count;
    else poolUsed += it.qty * cost(e.entry);
  });
  const poolSlots = f.roster.pool?.slots || 0;
  return { poolUsed, poolSlots, reqTotal, used: reqTotal + poolUsed, total: reqTotal + poolSlots };
}

function maxFor(e) {
  if (e.required) return e.entry.count;
  const { poolUsed, poolSlots } = slots();
  const it = item(e.key, e);
  const free = poolSlots - poolUsed + it.qty * cost(e.entry);
  const bySlots = Math.floor(free / cost(e.entry) + 1e-9);
  return e.entry.max == null ? bySlots : Math.min(e.entry.max, bySlots);
}

// Cuenta agentes que cumplen una restricción: por tipo, por clave de entrada
// o por texto (regex) en la etiqueta / armamento elegido (p. ej. "plasma|fusión").
function countFor(f, c) {
  const re = c.match ? new RegExp(c.match, 'i') : null;
  return entriesOf(f).reduce((n, e) => {
    const it = item(e.key, e);
    if (!it.qty) return n;
    const lo = e.entry.loadouts && it.loadoutIdx >= 0 ? e.entry.loadouts[it.loadoutIdx].label : '';
    const hit = (c.types && c.types.includes(e.entry.type)) || (c.keys && c.keys.includes(e.key)) ||
                (re && re.test((e.entry.label || '') + ' ' + lo));
    return hit ? n + it.qty : n;
  }, 0);
}
const typeCount = (f, types) => countFor(f, { types });

function allPloys(f) {
  return [
    ...(f.pl?.s || []).map(p => ({ n: p.n, t: p.t, k: 'Estrategia' })),
    ...(f.pl?.f || []).map(p => ({ n: p.n, t: p.t, k: 'Tiroteo' })),
  ];
}

function factionEq(f) {
  if (f.roster.equipment?.faction) return f.roster.equipment.faction.map(e => ({ id: e.id, n: e.n, t: e.note || e.t || '' }));
  return (f.eq || []).map(e => ({ id: 'f-' + slug(e.n), n: e.n, t: e.t }));
}
const universalEq = f => (window.UNIVERSAL_EQUIPMENT || []).filter(u => (f.roster.equipment?.universal || []).includes(u.id));

// ── Validación declarativa: avisa en vivo, bloquea al avanzar ─
function checks(f = F()) {
  const out = [];
  const s = slots(f);
  const half = n => Math.round(n * 2) / 2;
  out.push({ ok: half(s.poolUsed) === s.poolSlots, msg: `Plazas ${half(s.used)}/${s.total}`,
             err: half(s.poolUsed) < s.poolSlots ? `Faltan ${s.poolSlots - half(s.poolUsed)} plaza(s) por cubrir.` : `Te sobran ${half(s.poolUsed) - s.poolSlots} plaza(s).` });

  entriesOf(f).forEach(e => {
    const it = item(e.key, e);
    if (it.qty > 0 && e.entry.loadouts?.length && it.loadoutIdx < 0)
      out.push({ ok: false, msg: 'Armamento', err: `“${e.entry.label || e.op?.name || e.entry.type}” necesita un armamento elegido.` });
    if (e.entry.type === 'ARDID_0PM' && it.qty > 0) {
      const n = it.ploys.length;
      out.push({ ok: n === it.qty, msg: `Ardides 0PM ${n}/${it.qty}`, err: `Elige ${it.qty - n} ardid(es) más para que cuesten 0PM.` });
    }
  });

  (f.roster.constraints || []).forEach(c => {
    const n = countFor(f, c);
    const ok = (c.min == null || n >= c.min) && (c.max == null || n <= c.max);
    const label = c.label || (c.min != null ? `Mín. ${c.min} ${(c.types || ['agentes'])[0].toLowerCase()}` : `Máx. ${c.max}`);
    out.push({ ok, msg: label, err: c.msg });
  });
  return out;
}
const firstError = f => (checks(f).find(c => !c.ok) || {}).err || null;

// ── Borrador automático y comandos guardados ─────────────────
const saveDraft = () => { if (state.factionId) KT.store.set(DRAFT_KEY, { ...state, open: {} }); };
const savedList = () => KT.store.get(SAVED_KEY, []);

function serialize() {
  const f = F();
  const ops = [], ploys0 = [];
  entriesOf(f).forEach(e => {
    const it = item(e.key, e);
    if (!it.qty) return;
    if (e.entry.type === 'ARDID_0PM') { ploys0.push(...it.ploys); return; }
    ops.push({
      key: e.key, type: e.entry.type, opId: e.op?.id || null, qty: it.qty,
      label: e.entry.label || e.op?.name || e.entry.type,
      loadout: e.entry.loadouts && it.loadoutIdx >= 0 ? e.entry.loadouts[it.loadoutIdx].label : null,
    });
  });
  const now = new Date().toISOString();
  return {
    schema: 'kt-roster/1',
    id: state.editingId || ('r' + Date.now().toString(36)),
    name: state.name.trim() || defaultName(),
    factionId: state.factionId, factionVersion: f.version || null,
    ops, ploys0, equipment: [...state.equipment],
    created: (savedList().find(r => r.id === state.editingId) || {}).created || now, updated: now,
  };
}

function deserialize(r) {
  const f = FACTIONS[r.factionId];
  if (!f?.roster) throw new Error('El comando “' + r.factionId + '” no existe o no tiene reglas de composición.');
  state = newState();
  state.factionId = r.factionId; state.name = r.name || ''; state.editingId = r.id || null;
  const list = entriesOf(f);
  (r.ops || []).forEach(o => {
    const e = list.find(x => x.key === o.key) || list.find(x => x.entry.type === o.type && !x.required);
    if (!e) return;
    const it = item(e.key, e);
    if (!e.required) it.qty = o.qty;
    if (o.loadout && e.entry.loadouts) it.loadoutIdx = e.entry.loadouts.findIndex(l => l.label === o.loadout);
  });
  if (r.ploys0?.length) {
    const e = list.find(x => x.entry.type === 'ARDID_0PM');
    if (e) { const it = item(e.key, e); it.ploys = [...r.ploys0]; it.qty = r.ploys0.length; }
  }
  state.equipment = [...(r.equipment || [])];
}

const defaultName = () => (F()?.name || 'Comando') + ' ' + new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });

function saveRoster() {
  const err = firstError();
  if (err) { KT.toast('No se puede guardar: ' + err, { type: 'err' }); return; }
  const r = serialize();
  const list = savedList().filter(x => x.id !== r.id);
  list.unshift(r);
  if (!KT.store.set(SAVED_KEY, list)) { KT.toast('El navegador no permite guardar (¿modo privado?). Usa Exportar.', { type: 'err', ms: 4000 }); return; }
  state.editingId = r.id; state.name = r.name;
  saveDraft();
  KT.toast(`“${KT.esc(r.name)}” guardado`, { type: 'ok' });
}

function download(name, text, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportRoster(r = serialize()) { download(slug(r.name) + '.killteam.json', JSON.stringify(r, null, 2)); KT.toast('Exportado como JSON', { type: 'ok' }); }

function rosterText() {
  const f = F(), r = serialize();
  const lines = [`${r.name} — ${f.name}`, ''];
  r.ops.forEach(o => lines.push(`${o.qty > 1 ? o.qty + '× ' : ''}${o.label}${o.loadout ? ' (' + o.loadout + ')' : ''}`));
  if (r.ploys0.length) lines.push('', 'Ardides a 0PM: ' + r.ploys0.join(', '));
  const eqAll = [...factionEq(f), ...universalEq(f)];
  if (r.equipment.length) lines.push('', 'Equipo: ' + r.equipment.map(id => eqAll.find(e => e.id === id)?.n || id).join(', '));
  return lines.join('\n');
}
async function copyText() {
  try { await navigator.clipboard.writeText(rosterText()); KT.toast('Lista copiada al portapapeles', { type: 'ok' }); }
  catch { KT.toast('No se pudo copiar', { type: 'err' }); }
}

function openSaved(id) {
  const r = savedList().find(x => x.id === id);
  if (!r) return;
  try { deserialize(r); setStep(4); KT.toast(`“${KT.esc(r.name)}” cargado`); }
  catch (e) { KT.toast(e.message, { type: 'err' }); }
}
function duplicateSaved(id, ev) {
  ev.stopPropagation();
  const list = savedList(), r = list.find(x => x.id === id);
  if (!r) return;
  const copy = { ...r, id: 'r' + Date.now().toString(36), name: r.name + ' (copia)', created: new Date().toISOString(), updated: new Date().toISOString() };
  list.unshift(copy); KT.store.set(SAVED_KEY, list); render(true);
  KT.toast('Duplicado', { type: 'ok' });
}
function deleteSaved(id, ev) {
  ev.stopPropagation();
  const list = savedList(), idx = list.findIndex(x => x.id === id);
  if (idx < 0) return;
  const [gone] = list.splice(idx, 1);
  KT.store.set(SAVED_KEY, list); render();
  KT.toast(`“${KT.esc(gone.name)}” borrado`, { action: 'Deshacer', ms: 5000, onAction: () => {
    const l = savedList(); l.splice(idx, 0, gone); KT.store.set(SAVED_KEY, l); render();
  } });
}
function exportSaved(id, ev) { ev.stopPropagation(); const r = savedList().find(x => x.id === id); if (r) exportRoster(r); }

document.getElementById('import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const r = JSON.parse(await file.text());
    if (r.schema !== 'kt-roster/1') throw new Error('No es un comando exportado desde esta app.');
    deserialize(r); state.editingId = null;
    setStep(4); KT.toast(`“${KT.esc(r.name)}” importado. Pulsa Guardar para conservarlo.`, { type: 'ok', ms: 3500 });
  } catch (err) { KT.toast('Importación fallida: ' + err.message, { type: 'err', ms: 4000 }); }
});

// ── Navegación de pasos ──────────────────────────────────────
let lastStep = 1;
function maxReachable() {
  if (!state.factionId) return 1;
  return firstError() ? 2 : 4;
}

function setStep(n) {
  const dir = Math.sign(n - lastStep);
  lastStep = n;
  state.step = n;
  const reach = maxReachable();
  [1, 2, 3, 4].forEach(i => {
    const el = document.getElementById('step' + i);
    el.className = 'step' + (i === n ? ' active' : i < n ? ' done' : '') + (i <= reach && i !== n ? ' reach' : '');
    el.setAttribute('aria-selected', i === n);
  });
  document.getElementById('btn-prev').style.display = n > 1 ? '' : 'none';
  const next = document.getElementById('btn-next');
  next.innerHTML = n === 3 ? 'Ver resumen <i class="ti ti-arrow-right"></i>' : n === 4 ? '<i class="ti ti-device-floppy"></i> Guardar' : 'Siguiente <i class="ti ti-arrow-right"></i>';
  next.style.display = n === 1 ? 'none' : '';
  hideError();
  render(true, dir);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (state.factionId) history.replaceState(null, '', '#' + state.factionId);
  else history.replaceState(null, '', location.pathname);
}

function nextStep() {
  if (state.step === 1) {
    if (!state.factionId) { showError('Selecciona un comando primero.'); return; }
    setStep(2);
  } else if (state.step === 2) {
    const err = firstError();
    if (err) { showError(err); KT.shake(document.querySelector('.status')); return; }
    setStep(3);
  } else if (state.step === 3) {
    setStep(4);
  } else if (state.step === 4) {
    saveRoster();
  }
}
function prevStep() { if (state.step > 1) setStep(state.step - 1); }

document.getElementById('stepper').addEventListener('click', e => {
  const st = e.target.closest('.step.reach');
  if (st) setStep(+st.dataset.step);
});

// ── Errores ──────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('error-pill');
  document.getElementById('error-msg').textContent = msg;
  el.classList.add('show'); KT.shake(el);
}
function hideError() { document.getElementById('error-pill').classList.remove('show'); }

// ── Render ───────────────────────────────────────────────────
function render(animate = false, dir = 0) {
  const view = document.getElementById('view');
  const html = state.step === 1 ? renderStep1() : state.step === 2 ? renderStep2() : state.step === 3 ? renderStep3() : renderStep4();
  view.innerHTML = html;
  if (animate) {
    view.style.setProperty('--dir', (dir * 18) + 'px');
    view.classList.remove('pane-anim'); void view.offsetWidth; view.classList.add('pane-anim');
  } else view.querySelectorAll('.reveal').forEach(x => x.classList.remove('reveal'));
  updateActionInfo();
  if (state.step > 1) saveDraft();
  // Pasos alcanzables (el stepper refleja la validez en vivo)
  const reach = maxReachable();
  [1, 2, 3, 4].forEach(i => document.getElementById('step' + i).classList.toggle('reach', i <= reach && i !== state.step));
}

let lastUsed = null;
function updateActionInfo() {
  const el = document.getElementById('action-info');
  if (state.step === 2 && state.factionId) {
    const s = slots();
    const pct = Math.min(100, (s.used / s.total) * 100);
    el.innerHTML = `<span>Plazas: <b id="ai-n" style="color:var(--orange)">${s.used}</b> / ${s.total}</span><div class="pbar${pct >= 100 ? ' done' : ''}" style="--p:${pct}%"><span></span></div>`;
    if (lastUsed !== null && lastUsed !== s.used) KT.bump(document.getElementById('ai-n'));
    lastUsed = s.used;
  } else if (state.step === 3 && state.factionId) {
    const n = state.equipment.length, max = F().roster.equipment?.slots || 4;
    el.innerHTML = `<span>Equipo: <b style="color:var(--orange)">${n}</b> / ${max}</span><div class="pbar${n >= max ? ' done' : ''}" style="--p:${(n / max) * 100}%"><span></span></div>`;
  } else if (state.step === 4) {
    el.innerHTML = `<span>${state.editingId ? 'Editando comando guardado' : 'Sin guardar'} · <kbd>${MOD}</kbd><kbd>S</kbd></span>`;
  } else el.textContent = '';
}

// ═══ PASO 1 — COMANDO ══════════════════════════════════════
function renderStep1() {
  const saved = savedList();
  const savedHtml = saved.length
    ? `<div class="saved-grid">${saved.map((r, i) => {
        const f = FACTIONS[r.factionId];
        const n = (r.ops || []).reduce((s, o) => s + o.qty, 0);
        const d = new Date(r.updated).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
        return `<div class="saved spot lift reveal" style="--i:${i}" tabindex="0" onclick="openSaved('${r.id}')"
                  onkeydown="if(event.key==='Enter')openSaved('${r.id}')">
          <div class="saved-name">${KT.esc(r.name)}</div>
          <div class="saved-meta"><b>${KT.esc(f?.name || r.factionId)}</b> · ${n} agentes · ${d}</div>
          <div class="saved-acts">
            <button class="icon-btn" title="Duplicar" aria-label="Duplicar" onclick="duplicateSaved('${r.id}', event)"><i class="ti ti-copy"></i></button>
            <button class="icon-btn" title="Exportar JSON" aria-label="Exportar" onclick="exportSaved('${r.id}', event)"><i class="ti ti-download"></i></button>
            <button class="icon-btn" title="Borrar" aria-label="Borrar" onclick="deleteSaved('${r.id}', event)"><i class="ti ti-trash"></i></button>
          </div>
        </div>`; }).join('')}</div>`
    : `<div class="empty-saved reveal"><i class="ti ti-folder-open" style="font-size:22px;display:block;margin-bottom:4px"></i>Aún no has guardado comandos. Crea uno abajo.</div>`;

  const all = Object.values(FACTIONS);
  const cards = all.map((f, i) => {
    const ok = !!f.roster;
    const archetypes = (f.roster?.archetypes || f.tags || []).map(a => `<span class="ftag">${a}</span>`).join('');
    const img = f.img
      ? `<img class="faction-card-img" src="${f.img}" alt="" loading="lazy" onerror="this.outerHTML='<div class=faction-card-ph>${f.icon || '⚔'}</div>'">`
      : `<div class="faction-card-ph">${f.icon || '⚔'}</div>`;
    return `<div class="faction-card ${ok ? 'spot lift' : 'no-roster'} reveal" style="--i:${i}" ${ok ? `tabindex="0" onclick="selectFaction('${f.id}')" onkeydown="if(event.key==='Enter')selectFaction('${f.id}')"` : 'aria-disabled="true"'}>
      ${img}
      <div class="faction-card-body">
        <div class="faction-card-sub">${f.subfaction}</div>
        <div class="faction-card-name">${f.name}</div>
        <div class="faction-card-tags">${archetypes}</div>
        ${ok ? '' : '<div class="nr"><i class="ti ti-lock"></i> Sin reglas de composición todavía</div>'}
      </div>
    </div>`;
  }).join('');

  return `
    <div class="sec-lbl">Mis comandos <span style="font-family:var(--font-mono);font-weight:400;color:var(--orange)">${saved.length || ''}</span></div>
    <div class="tools-row">
      <button class="icon-btn" onclick="document.getElementById('import-file').click()"><i class="ti ti-upload"></i> Importar JSON</button>
    </div>
    ${savedHtml}
    <div class="sec-lbl">Nuevo comando</div>
    <div class="faction-grid">${cards}</div>`;
}

function selectFaction(id) {
  const keepDraft = state.factionId === id && Object.keys(state.roster).length;
  if (!keepDraft) { state = newState(); state.factionId = id; }
  entriesOf(F()).forEach(e => item(e.key, e));
  setStep(2);
}

// ═══ PASO 2 — OPERATIVOS ═══════════════════════════════════
function renderStep2() {
  const f = F();
  const s = slots(f);
  const list = entriesOf(f);
  const cs = checks(f);
  const pct = Math.min(100, s.used / s.total * 100);

  let html = `
    <div class="status">
      <div class="counter-bar${pct >= 100 ? ' full' : ''}">
        <div class="counter-bar-label">${f.name} · plazas cubiertas</div>
        <span class="counter-val">${s.used}</span><span class="counter-max"> / ${s.total}</span>
      </div>
      <div class="pbar${pct >= 100 && cs.every(c => c.ok) ? ' done' : ''}" style="--p:${pct}%"><span></span></div>
      <div class="checks">${cs.map(c => `<span class="chk ${c.ok ? 'ok' : 'bad'}" title="${KT.esc(c.ok ? 'Correcto' : c.err)}"><i class="ti ti-${c.ok ? 'check' : 'x'}"></i>${c.msg}</span>`).join('')}</div>
    </div>`;

  if (f.roster.pool?.note) html += `<div class="note-box"><i class="ti ti-info-circle"></i> ${f.roster.pool.note}</div>`;

  if (list.some(e => e.required)) html += `<div class="sec-lbl">Obligatorios</div>`;
  list.filter(e => e.required).forEach((e, i) => { html += renderEntry(e, i); });

  html += `<div class="sec-lbl">Agentes disponibles <span style="font-size:10px;font-weight:400;font-family:var(--font-mono);letter-spacing:0;color:var(--text-3)">${s.poolUsed} / ${s.poolSlots}</span></div>`;
  let sec = null;
  list.filter(e => !e.required).forEach((e, i) => {
    if (e.entry.section && e.entry.section !== sec) {
      sec = e.entry.section;
      html += `<div class="sec-lbl" style="margin-top:18px">${sec}</div>`;
    }
    html += renderEntry(e, i + 2);
  });
  return html;
}

function renderEntry(e, i) {
  if (e.entry.type === 'ARDID_0PM') return renderArdid(e, i);
  const op = e.op;
  const it = item(e.key, e);
  const qty = it.qty;
  const max = maxFor(e);
  const hasLoadout = e.entry.loadouts?.length > 0;
  const isOpen = !!state.open[e.key] || (hasLoadout && qty > 0 && it.loadoutIdx < 0);
  const name = e.entry.label || op?.name || e.entry.type;

  const stats = op ? `<span class="op-stat">LPA <span>${op.s.lpa}</span></span>
    <span class="op-stat">MOV <span>${op.s.mov}</span></span>
    <span class="op-stat">SALV <span>${op.s.salv}</span></span>
    <span class="op-stat">H <span>${op.s.h}</span></span>` : '';

  let info = '';
  if (hasLoadout && qty > 0) info = it.loadoutIdx >= 0
    ? `<div class="op-note"><i class="ti ti-sword" style="font-size:10px"></i> ${e.entry.loadouts[it.loadoutIdx].label}</div>`
    : `<div class="op-note" style="color:#f07070"><i class="ti ti-alert-circle" style="font-size:10px"></i> Elige armamento</div>`;
  if (e.entry.note) info += `<div class="op-note" style="color:var(--text-3)">${e.entry.note}</div>`;

  const actions = e.required
    ? `<span class="badge-req">FIJO ×${e.entry.count}</span>`
    : `<div class="qty-box">
        <button class="qty-btn" aria-label="Quitar" onclick="changeQty('${e.key}', -1, event)" ${qty <= 0 ? 'disabled' : ''}>−</button>
        <span class="qty-num ${qty > 0 ? 'on' : ''}" id="q-${e.key}">${qty}</span>
        <button class="qty-btn" aria-label="Añadir" onclick="changeQty('${e.key}', 1, event)" ${qty >= max ? 'disabled' : ''}>+</button>
      </div>${e.entry.half ? '<span class="badge-half">½</span>' : ''}${e.entry.cost > 1 ? `<span class="badge-half">×${e.entry.cost}</span>` : ''}`;

  // Panel desplegable: armamento elegible o perfil de armas
  let panel = '';
  if (hasLoadout) {
    panel = `<div class="loadout-title"><i class="ti ti-sword"></i> Elige el armamento</div><div class="loadout-opts">` +
      e.entry.loadouts.map((lo, idx) => `
        <div class="loadout-opt ${it.loadoutIdx === idx ? 'chosen' : ''}" onclick="chooseLoadout('${e.key}', ${idx}, event)">
          <div class="loadout-label">${lo.label}</div>
          <div class="loadout-weapons">${lo.w.map(w => `<span class="wpill">${w.n}</span>${w.r?.length ? `<span class="wpill wpill-rules">${w.r.join(', ')}</span>` : ''}`).join('')}</div>
        </div>`).join('') + `</div>`;
  } else if (op) {
    panel = `<div class="loadout-title"><i class="ti ti-sword"></i> Armamento</div><div class="loadout-weapons">` +
      op.w.map(w => `<span class="wpill">${w.n} · ${w.a}/${w.i}/${w.d}</span>${w.r?.length ? `<span class="wpill wpill-rules">${w.r.join(', ')}</span>` : ''}`).join('') + `</div>` +
      ((op.ru || []).length ? `<div class="loadout-title" style="margin-top:10px">Habilidades</div><div style="font-size:11px;color:var(--text-2);line-height:1.5">${op.ru.map(r => `<b style="color:var(--text);font-family:var(--font-display);text-transform:uppercase;letter-spacing:.04em">${r.n}</b> — ${r.t}`).join('<br>')}</div>` : '');
  }

  let cls = 'op-entry spot reveal';
  if (e.required) cls += ' required-op';
  if (qty > 0) cls += ' selected';
  if (isOpen) cls += ' open';
  if (!e.required && qty === 0 && max === 0) cls += ' unavail';

  return `
    <div class="${cls}" id="oe-${e.key}" style="--i:${Math.min(i, 14)}">
      <div class="op-row" tabindex="0" role="button" aria-expanded="${isOpen}" onclick="togglePanel('${e.key}')"
           onkeydown="entryKey(event, '${e.key}')">
        <div class="op-meta">
          <div class="op-type-badge">${e.entry.type}</div>
          <div class="op-name">${name}</div>
          <div class="op-stats">${stats}</div>
          ${info}
        </div>
        <div class="op-actions">${actions}${panel ? '<i class="ti ti-chevron-down chv"></i>' : ''}</div>
      </div>
      ${panel ? `<div class="acc loadout-panel"><div class="acc-in"><div class="lp-in">${panel}</div></div></div>` : ''}
    </div>`;
}

function renderArdid(e, i) {
  const f = F();
  const it = item(e.key, e);
  const qty = it.qty, max = maxFor(e);
  const isOpen = qty > 0 || !!state.open[e.key];
  const ploys = allPloys(f);
  const chips = ploys.map(p => {
    const on = it.ploys.includes(p.n);
    const dis = !on && it.ploys.length >= qty;
    return `<button class="ploy ${on ? 'on' : ''}" ${dis ? 'disabled' : ''} title="${KT.esc(p.t)}" onclick="togglePloy('${e.key}', ${JSON.stringify(p.n).replace(/"/g, '&quot;')}, event)">
      <small>${p.k}</small><b>${p.n}</b></button>`;
  }).join('');
  return `
    <div class="op-entry spot reveal ${qty > 0 ? 'selected' : ''} ${isOpen ? 'open' : ''}" id="oe-${e.key}" style="--i:${Math.min(i, 14)};${qty > 0 ? 'border-color:var(--action);border-left-color:var(--action)' : ''}">
      <div class="op-row" tabindex="0" role="button" aria-expanded="${isOpen}" onclick="togglePanel('${e.key}')" onkeydown="entryKey(event, '${e.key}')">
        <div class="op-meta">
          <div class="op-type-badge" style="color:var(--action)">ARDID A 0PM</div>
          <div class="op-name" style="font-size:15px">Sustituir un Soldado por un ardid</div>
          <div class="op-note" style="color:var(--text-3)">${e.entry.note || ''}</div>
          ${qty > 0 ? `<div class="op-note">${it.ploys.length}/${qty} elegidos${it.ploys.length ? ': ' + it.ploys.join(', ') : ''}</div>` : ''}
        </div>
        <div class="op-actions">
          <div class="qty-box">
            <button class="qty-btn" aria-label="Quitar" onclick="changeQty('${e.key}', -1, event)" ${qty <= 0 ? 'disabled' : ''}>−</button>
            <span class="qty-num ${qty > 0 ? 'on' : ''}" id="q-${e.key}">${qty}</span>
            <button class="qty-btn" aria-label="Añadir" onclick="changeQty('${e.key}', 1, event)" ${qty >= max ? 'disabled' : ''}>+</button>
          </div>
          <i class="ti ti-chevron-down chv"></i>
        </div>
      </div>
      <div class="acc loadout-panel"><div class="acc-in"><div class="lp-in">
        <div class="loadout-title"><i class="ti ti-chess-knight"></i> ${qty ? `Elige ${qty} ardid${qty > 1 ? 'es' : ''} que costarán 0PM` : 'Añade al menos uno con + para elegir'}</div>
        <div class="ploy-grid">${chips}</div>
      </div></div></div>
    </div>`;
}

function entryKey(ev, key) {
  if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); togglePanel(key); }
  else if (ev.key === '+' || ev.key === 'ArrowRight') { ev.preventDefault(); changeQty(key, 1, ev, true); }
  else if (ev.key === '-' || ev.key === 'ArrowLeft') { ev.preventDefault(); changeQty(key, -1, ev, true); }
}

function togglePanel(key) {
  const el = document.getElementById('oe-' + key);
  if (!el || !el.querySelector('.acc')) return;
  const open = !el.classList.contains('open');
  el.classList.toggle('open', open);
  el.querySelector('.op-row').setAttribute('aria-expanded', open);
  state.open[key] = open;
}

function changeQty(key, delta, ev, refocus = false) {
  ev && ev.stopPropagation();
  const e = entriesOf(F()).find(x => x.key === key);
  if (!e || e.required) return;
  const it = item(key, e);
  const max = maxFor(e);
  const next = Math.max(0, Math.min(max, it.qty + delta));
  if (next === it.qty) { if (delta > 0) KT.shake(document.getElementById('oe-' + key)); return; }
  it.qty = next;
  if (next === 0) { it.loadoutIdx = e.entry.loadouts ? -1 : null; }
  if (it.ploys.length > next) it.ploys = it.ploys.slice(0, next);
  if (delta > 0 && e.entry.type === 'ARDID_0PM') state.open[key] = true;
  hideError();
  render();
  KT.bump(document.getElementById('q-' + key));
  if (refocus) document.querySelector(`#oe-${CSS.escape(key)} .op-row`)?.focus();
}

function chooseLoadout(key, idx, ev) {
  ev.stopPropagation();
  item(key).loadoutIdx = idx;
  state.open[key] = false;
  render();
}

function togglePloy(key, name, ev) {
  ev.stopPropagation();
  const it = item(key);
  if (it.ploys.includes(name)) it.ploys = it.ploys.filter(p => p !== name);
  else if (it.ploys.length < it.qty) it.ploys.push(name);
  state.open[key] = true;
  render();
}

// ═══ PASO 3 — EQUIPO ═══════════════════════════════════════
function renderStep3() {
  const f = F();
  const max = f.roster.equipment?.slots || 4;
  const used = state.equipment.length;
  const full = used >= max;
  const card = (e, badge, i) => {
    const sel = state.equipment.includes(e.id);
    const dis = !sel && full;
    return `<div class="eq-card spot reveal${sel ? ' selected' : ''}${dis ? ' disabled-card' : ''}" style="--i:${i}" tabindex="${dis ? -1 : 0}" role="checkbox" aria-checked="${sel}"
        onclick="${dis ? '' : `toggleEquip('${e.id}')`}" onkeydown="if(!${dis}&&(event.key===' '||event.key==='Enter')){event.preventDefault();toggleEquip('${e.id}')}">
      <div class="eq-check"><i class="ti ti-check"></i></div>
      <div class="eq-info">
        ${badge ? `<div class="eq-faction-badge">${badge}</div>` : ''}
        <div class="eq-name">${e.n}${e.q ? `<span class="eq-qty">×${e.q}</span>` : ''}</div>
        <div class="eq-txt">${e.t ? e.t.replace(/\n/g, '<br>') : '<span style="color:var(--text-3)">Sin texto.</span>'}</div>
      </div>
    </div>`;
  };
  const fe = factionEq(f), ue = universalEq(f);
  return `
    <div class="status">
      <div class="eq-bar" style="background:none;border:none;padding:0 0 8px;margin:0">
        <div class="eq-bar-label">Piezas de equipo</div>
        <span class="eq-slots${full ? ' full' : ''}">${used} / ${max}</span>
      </div>
      <div class="pbar${full ? ' done' : ''}" style="--p:${used / max * 100}%"><span></span></div>
    </div>
    ${fe.length ? `<div class="sec-lbl">Equipo de facción</div>${fe.map((e, i) => card(e, 'Facción', i)).join('')}` : ''}
    ${ue.length ? `<div class="sec-lbl">Equipo universal</div>${ue.map((e, i) => card(e, '', i + fe.length)).join('')}` : ''}`;
}

function toggleEquip(id) {
  const max = F().roster.equipment?.slots || 4;
  if (state.equipment.includes(id)) state.equipment = state.equipment.filter(x => x !== id);
  else { if (state.equipment.length >= max) { KT.toast(`Máximo ${max} piezas de equipo`, { type: 'err' }); return; } state.equipment.push(id); }
  hideError();
  const y = scrollY; render(); scrollTo(0, y);
}

// ═══ PASO 4 — RESUMEN ══════════════════════════════════════
function renderStep4() {
  const f = F();
  const r = serialize();
  const rows = r.ops.map((o, i) => {
    const op = f.ops.find(x => x.id === o.opId);
    return `<tr class="reveal" style="--i:${i}">
      <td><span class="t">${o.type}</span><span class="n">${o.label}</span>${o.qty > 1 ? ` <span class="x">×${o.qty}</span>` : ''}${o.loadout ? `<div class="summary-op-loadout">${o.loadout}</div>` : ''}</td>
      <td>${op?.s.lpa ?? '—'}</td><td>${op?.s.mov ?? '—'}</td><td>${op?.s.salv ?? '—'}</td><td>${op?.s.h ?? '—'}</td>
    </tr>`;
  }).join('');
  const eqAll = [...factionEq(f), ...universalEq(f)];
  const eqPills = r.equipment.map(id => `<span class="summary-eq-pill">${eqAll.find(e => e.id === id)?.n || id}</span>`).join('');
  const ployPills = r.ploys0.map(p => `<span class="summary-eq-pill zero-pill">${p} · 0PM</span>`).join('');
  const total = r.ops.reduce((n, o) => n + o.qty, 0);

  return `
    <div class="summary-card reveal">
      <input class="name-in" id="name-in" value="${KT.esc(state.name || r.name)}" aria-label="Nombre del comando" placeholder="Nombre del comando"
             oninput="state.name=this.value; saveDraft()" onkeydown="if(event.key==='Enter')this.blur()">
      <div class="sum-sub">${f.name} · ${total} agentes${f.version ? ' · v' + f.version : ''}</div>
      <div class="sec-lbl">Operativos</div>
      <table class="sum-tbl">
        <thead><tr><th>Agente</th><th>LPA</th><th>MOV</th><th>SALV</th><th>H</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" style="color:var(--text-3)">Sin operativos</td></tr>'}</tbody>
      </table>
      ${ployPills ? `<div class="sec-lbl" style="margin-top:14px">Ardides a 0PM</div><div class="summary-eq">${ployPills}</div>` : ''}
      <div class="sec-lbl" style="margin-top:14px">Equipo</div>
      ${eqPills ? `<div class="summary-eq">${eqPills}</div>` : '<div style="color:var(--text-3);font-size:12px">Sin equipo seleccionado</div>'}
    </div>
    <div class="sum-acts">
      <button class="icon-btn accent ripple" onclick="saveRoster()"><i class="ti ti-device-floppy"></i> Guardar</button>
      <button class="icon-btn" onclick="playRoster()" title="Guarda y abre el modo de juego con este comando"><i class="ti ti-swords"></i> Jugar</button>
      <button class="icon-btn" onclick="copyText()"><i class="ti ti-clipboard-text"></i> Copiar lista</button>
      <button class="icon-btn" onclick="exportRoster()"><i class="ti ti-download"></i> Exportar</button>
      <button class="icon-btn" onclick="window.print()"><i class="ti ti-printer"></i> Imprimir</button>
      <span style="flex:1"></span>
      <button class="icon-btn" onclick="setStep(2)"><i class="ti ti-users"></i> Operativos</button>
      <button class="icon-btn" onclick="setStep(3)"><i class="ti ti-package"></i> Equipo</button>
      <button class="icon-btn" onclick="newRoster()"><i class="ti ti-plus"></i> Nuevo</button>
    </div>`;
}

function playRoster() {
  if (firstError()) { KT.toast('Completa el comando antes de jugar', { type: 'err' }); return; }
  saveRoster();
  if (state.editingId) location.href = 'partida.html?p1=' + encodeURIComponent(state.editingId);
}

function newRoster() {
  const prev = state.factionId ? JSON.parse(JSON.stringify(state)) : null;
  KT.store.del(DRAFT_KEY);
  state = newState();
  setStep(1);
  if (prev) KT.toast('Borrador descartado', { action: 'Deshacer', ms: 5000, onAction: () => { state = prev; setStep(prev.step || 2); } });
}

// ── Atajos ───────────────────────────────────────────────────
function showHelp() {
  KT.helpModal([
    ['Alt →', 'Siguiente paso'],
    ['Alt ←', 'Paso anterior'],
    ['Tab', 'Moverse entre agentes'],
    ['+ −', 'Añadir / quitar el agente con foco'],
    ['↵', 'Abrir / cerrar detalles del agente'],
    [MOD + ' S', 'Guardar comando'],
    ['?', 'Mostrar esta ayuda'],
  ]);
}
KT.keys({
  'alt+ArrowRight': () => nextStep(),
  'alt+ArrowLeft': () => prevStep(),
  'mod+s': () => { if (state.factionId && state.step > 1) saveRoster(); },
  '?': showHelp,
}, { allowInInput: ['Escape', 'mod+s'] });

// ── Init: hash > borrador > inicio ───────────────────────────
window.addEventListener('load', () => {
  KT.initFx();
  const factions = Object.values(FACTIONS).filter(f => f.roster);
  console.log('[Builder] Facciones con roster:', factions.map(f => f.id), '· equipo universal:', (window.UNIVERSAL_EQUIPMENT || []).length);

  const hash = location.hash.replace('#', '');
  const draft = KT.store.get(DRAFT_KEY);
  if (draft && FACTIONS[draft.factionId]?.roster && (!hash || hash === draft.factionId)) {
    state = { ...newState(), ...draft, open: {} };
    setStep(Math.min(draft.step || 2, maxReachable()));
    KT.toast('Borrador recuperado', { action: 'Descartar', ms: 4500, onAction: newRoster });
  } else if (hash && FACTIONS[hash]?.roster) {
    selectFaction(hash);
  } else {
    setStep(1);
  }
});
</script>
</body>
</html>
